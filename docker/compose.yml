name: enerthya

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: enerthya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: enerthya
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enerthya -d enerthya"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  panel:
    image: enerthya-host:${ENERTHYA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://enerthya:${POSTGRES_PASSWORD}@postgres:5432/enerthya
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:8420}
      PORT: "8420"
      HOSTNAME: 0.0.0.0
    ports:
      - "${ENERTHYA_BIND:-127.0.0.1}:${ENERTHYA_PORT:-8420}:8420"

  # The deploy runtime. Off by default: it mounts the host's container socket,
  # which is equivalent to root on this machine. Enable with COMPOSE_PROFILES=runtime
  # (install.sh --with-runtime) once you accept that trade.
  #
  # Host networking is deliberate: the worker starts containers on the host and
  # health-checks them through the port the runtime published, which lives on
  # the host's loopback — not on this container's.
  worker:
    profiles: ["runtime"]
    image: enerthya-host:${ENERTHYA_VERSION:-latest}
    restart: unless-stopped
    network_mode: host
    # Root inside this container only, to reach a socket owned by root:docker.
    # The socket is already equivalent to root on the host.
    user: "0:0"
    command: ["node", "apps/worker/dist/index.cjs"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://enerthya:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@127.0.0.1:${POSTGRES_PORT:-5432}/enerthya
      REDIS_URL: redis://127.0.0.1:${REDIS_PORT:-6379}
      DOCKER_HOST: unix:///var/run/docker.sock
      CADDY_ADMIN_URL: http://127.0.0.1:2019
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # The reverse proxy, generated from the database. Host networking so it can
  # reach the port each container published on the host's loopback, and so :80
  # and :443 are the host's own. Caddy obtains certificates itself.
  proxy:
    profiles: ["runtime"]
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    # Caddy's admin API only accepts requests whose origin is listed. The
    # bootstrap file sets that once; every config the worker loads keeps it.
    command:
      - sh
      - -c
      - printf '{\n\tadmin 127.0.0.1:2019 {\n\t\torigins http://127.0.0.1:2019\n\t}\n}\n' > /tmp/Caddyfile && caddy run --config /tmp/Caddyfile
    volumes:
      - caddy-data:/data

volumes:
  postgres-data:
  redis-data:
  caddy-data:
