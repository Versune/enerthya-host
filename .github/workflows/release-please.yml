name: Release please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Two runs on the same push would rewrite the release PR at the same time.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Conventional commits drive the version and CHANGELOG. Merging the
      # release PR tags the commit and publishes the GitHub release; the
      # artifact workflow then attaches the installable build.
      #
      # The enterprise policy forbids the built-in GITHUB_TOKEN from creating
      # pull requests, so this uses a fine-grained PAT stored as
      # RELEASE_PLEASE_TOKEN (Contents and Pull requests: write). A PAT also
      # means the release PR triggers CI, which a GITHUB_TOKEN PR would not.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
