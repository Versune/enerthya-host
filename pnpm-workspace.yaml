packages:
  - "apps/*"
  - "packages/*"

# drizzle-kit ships esbuild, whose postinstall is required for the CLI to run.
# ssh2's optional cpu-features native addon is denied: it is an optimisation,
# and ssh2 works without it.
allowBuilds:
  esbuild: true
  ssh2: true
  cpu-features: false
  # msgpackr-extract is an optional native accelerator for BullMQ's msgpack.
  # The pure-JS path is used instead, so the build script stays denied.
  msgpackr-extract: false
  # protobufjs' postinstall only prints its funding notice; no code is needed.
  protobufjs: false

minimumReleaseAgeExclude:
  - lucide-react@1.76.0

# Two advisories on the default branch: esbuild <= 0.24.2 (dev server) and
# minimatch < 11.0.1 (ReDoS). Both arrive transitively, so they are pinned here.
overrides:
  "esbuild@<0.25.0": 0.25.12
  "minimatch@>=7.0.0 <11.0.1": 11.0.1
